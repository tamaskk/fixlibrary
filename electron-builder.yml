appId: com.tamaskk.fixlibrary
productName: FixLibrary
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!**/.claude/*'
  - '!src/*'
  - '!docs/*'
  - '!tests/*'
  - '!python/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{vitest.config.ts,playwright.config.ts}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md,AGENTS.md,CLAUDE.md,CLAUDE.local.md,.mcp.json}'
  - '!{.env,.env.*,.npmrc}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!drizzle.config.ts'
  # The runtime and its archive ship as extraResources, never inside the asar.
  - '!build/*'
  # The tools ship once, as extraResources, not a second time inside the asar.
  - '!resources/*'
  # better-sqlite3 ships its sources and a prebuilt binary for every platform.
  - '!**/node_modules/better-sqlite3/{deps,src}/**'
  - '!**/node_modules/better-sqlite3/prebuilds/{win32,linux,linuxmusl}-*.node'
  - '!**/node_modules/better-sqlite3/prebuilds/darwin-x64.node'
# The migrator reads plain files, so the SQL migrations sit next to the asar.
extraResources:
  # ffmpeg, fpcalc and mp3gain from scripts/fetch-binaries.sh, with their licences.
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
      - '!.installed-sha256'
      - '!.recipe-sha256'
  # The Python runtime of scripts/build-python.sh, unpacked at the first start (T-041).
  - from: build
    to: python
    filter:
      - python-runtime-*.tar.gz
      - python-runtime.json
  - from: src/main/db/migrations
    to: migrations
    # The snapshots are only for drizzle-kit; the journal and the SQL files are needed.
    filter:
      - '**/*'
      - '!meta/*_snapshot.json'
asarUnpack:
  - '**/*.node'
mac:
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.music
  identity: '-'
  # Signed ad hoc, without an Apple Developer ID: with the hardened runtime, library
  # validation would refuse the frameworks of an ad hoc signature (different Team IDs).
  hardenedRuntime: false
  notarize: false
# No other code can run as the app through its binary: no `ELECTRON_RUN_AS_NODE`, no
# `NODE_OPTIONS`, no `--inspect`, and the app.asar it loads is the one whose hash the
# signed Info.plist names. File protocol privileges stay: the page is loaded from a file.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
