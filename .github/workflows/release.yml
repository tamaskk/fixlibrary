name: Release

# A tag `v<version>` (the version of package.json) builds a release; `v<version>-<suffix>`
# builds a prerelease, which the app's updater never sees. The release is a DRAFT: the
# owner signs its manifest on their own machine and publishes it there
# (`npm run release:publish -- <tag>`), so the release key never reaches GitHub.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Apple Silicon: the app, its runtime and its native modules are arm64 macOS only;
    # macOS 15, as Essentia has wheels for nothing older.
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the tag must name a commit of main.
          fetch-depth: 0

      - name: Check the tag against package.json and main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          # The same tag shape as `release:publish` accepts.
          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[A-Za-z0-9.]+)?$ ]] || [[ "${BASH_REMATCH[1]}" != "${version}" ]]; then
            echo "::error::the tag ${TAG} does not name version ${version} of package.json"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::the tag ${TAG} names a commit that is not on main"
            exit 1
          fi
          if [[ -n "${BASH_REMATCH[2]}" ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=${prerelease}" >>"${GITHUB_OUTPUT}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "runtime=$(tr -d '[:space:]' <python/runtime-version.txt)" >>"${GITHUB_OUTPUT}"

      # No caches: a release is built only from what the locks and the scripts pin.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: false
      # The whole environment: the weights are converted with torch, and the Python
      # tests run against Essentia and Demucs too.
      - run: uv sync --locked
        working-directory: python

      - run: ./scripts/fetch-binaries.sh
      - run: ./scripts/fetch-demucs-weights.sh
      - run: df -h /

      # A failing test stops the workflow: no release is created.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: uv run --no-sync pytest
        working-directory: python

      # Builds the runtime, the app and both DMGs, checking signatures and fuses.
      - run: ./scripts/build-dmg.sh
      - run: df -h /
      # The runtime unpacked to another path, signed and answering.
      - run: ./scripts/smoke-runtime.sh

      - name: Gather the files of the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RUNTIME: ${{ steps.version.outputs.runtime }}
        run: |
          mkdir dist
          cp "release/FixLibrary-${VERSION}-arm64.dmg" "release/FixLibrary-${VERSION}-arm64-lite.dmg" \
            "build/python-runtime-${RUNTIME}.tar.gz" dist/
          npm run release:key -- manifest dist "${VERSION}" "${RUNTIME}"
          (cd dist && shasum -a 256 -- *)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Holds the write token, apart from the build: no checkout, no npm, no uv runs here.
  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      # `release:publish` checks the manifest against this before the owner signs it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=(--repo "${GITHUB_REPOSITORY}" --draft --generate-notes --verify-tag --title "FixLibrary ${TAG}")
          if [[ "${PRERELEASE}" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "${TAG}" "${flags[@]}" dist/*
