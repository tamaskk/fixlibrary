name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    # Apple Silicon runner: the app and its native modules are arm64 macOS only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Python checks (uv run pytest, ruff) join here with task 2, when python/ exists.
