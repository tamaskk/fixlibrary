name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Apple Silicon runner: the app and its native modules are arm64 macOS only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # The bridge tests against the real sidecar skip here: there is no python/.venv.
      - run: npm run test
      - run: npm run build

  python:
    # The lock in python/uv.lock is arm64 macOS only.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
      # Only the dev tools and the package itself: the sidecar tests need neither
      # torch nor Essentia, and installing them would cost about 800 MB per run.
      - run: uv sync --locked --only-group dev
      - run: uv pip install --no-deps -e .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest
