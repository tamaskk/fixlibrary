name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    # Apple Silicon runner: the app and its native modules are arm64 macOS only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  python:
    # The lock in python/uv.lock is arm64 macOS only.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      # Only the dev tools and the package itself: the sidecar tests need neither
      # torch nor Essentia, and installing them would cost about 800 MB per run.
      - run: uv sync --locked --only-group dev
      - run: uv pip install --no-deps -e .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest
