[project]
name = "fixlib-py"
version = "0.1.0"
description = "FixLibrary audio sidecar"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.12"
dependencies = [
    "demucs>=4.1.0",
    "essentia>=2.1b6.dev1389",
    "mutagen>=1.48.1",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pyloudnorm>=0.2.0",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "yt-dlp>=2026.8.19",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

# The package sits directly in python/fixlib_py (docs/ARCHITECTURE.md §03), not in src/.
[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    # Already dependencies of the sidecar; listed here so CI, which installs only this
    # group, can run the tag and cover tests without torch and Essentia.
    "mutagen>=1.48.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

# Apple Silicon only (docs/PRD.md §01). A universal lock drags torch back to the
# last release that still shipped Intel macOS wheels.
[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Cooldown: nothing published after this date is resolved, so a compromised release
# has time to be noticed and yanked. Move the date forward when upgrading on purpose.
exclude-newer = "2026-09-27T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The spike sets PYTORCH_ENABLE_MPS_FALLBACK before it imports torch.
"spike/run_spike.py" = ["E402"]
